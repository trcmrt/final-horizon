# flag poles
- type: entity
  id: FHFlagPoleUSA
  parent: BaseStructure
  name: USA flag pole
  components:
  - type: Sprite
    sprite: _FinalHorizon/Structures/Decoration/flags_pole.rsi
    state: usa
    drawdepth: Mobs
    offset: "0.4,1.6"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.20,-0.20,0.20,0.20"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

